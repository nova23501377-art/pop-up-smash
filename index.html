<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pop-Up Smash!</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at top, #4338ca 0%, #1e1b4b 45%, #09090b 100%);
      color: white;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
    }

    button {
      font: inherit;
    }

    .app {
      width: min(96vw, 620px);
      padding: 20px 14px 28px;
      text-align: center;
    }

    .logo {
      margin: 0;
      font-size: clamp(42px, 10vw, 72px);
      line-height: 0.95;
      font-weight: 900;
      color: #facc15;
      letter-spacing: -3px;
      text-shadow:
        0 4px 0 #ea580c,
        0 8px 0 #9a3412,
        0 12px 25px rgba(0,0,0,.45);
    }

    .subtitle {
      margin: 14px 0 22px;
      font-size: clamp(15px, 4vw, 19px);
      color: #e2e8f0;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    /* CHARACTER SELECTION */

    .select-title {
      font-size: clamp(23px, 6vw, 32px);
      font-weight: 900;
      margin-bottom: 7px;
    }

    .select-help {
      color: #cbd5e1;
      margin-bottom: 20px;
      font-size: 15px;
    }

    .characters {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .character-card {
      border: 3px solid rgba(255,255,255,.15);
      background: rgba(255,255,255,.09);
      border-radius: 20px;
      padding: 13px 6px 12px;
      cursor: pointer;
      color: white;
      transition: transform .15s ease, border-color .15s ease, background .15s ease;
    }

    .character-card:hover {
      transform: translateY(-4px);
      background: rgba(255,255,255,.14);
    }

    .character-card.selected {
      border-color: #facc15;
      background: rgba(250,204,21,.18);
      transform: translateY(-5px) scale(1.02);
      box-shadow:
        0 0 0 3px rgba(250,204,21,.15),
        0 12px 25px rgba(0,0,0,.25);
    }

    .character-preview {
      width: min(20vw, 100px);
      height: min(20vw, 100px);
      min-width: 72px;
      min-height: 72px;
      margin: 0 auto 10px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: clamp(42px, 10vw, 65px);
      border: 4px solid white;
      box-shadow:
        inset 0 -8px 0 rgba(0,0,0,.12),
        0 7px 12px rgba(0,0,0,.3);
    }

    .character-card:nth-child(1) .character-preview {
      background: linear-gradient(145deg, #fef08a, #f97316);
    }

    .character-card:nth-child(2) .character-preview {
      background: linear-gradient(145deg, #86efac, #16a34a);
    }

    .character-card:nth-child(3) .character-preview {
      background: linear-gradient(145deg, #93c5fd, #7c3aed);
    }

    .character-name {
      font-weight: 900;
      font-size: clamp(13px, 3.5vw, 17px);
    }

    /* BUTTONS */

    .main-button {
      border: 0;
      border-radius: 17px;
      padding: 15px 32px;
      min-width: 210px;
      background: #facc15;
      color: #111827;
      font-size: 21px;
      font-weight: 900;
      cursor: pointer;
      box-shadow:
        0 6px 0 #b45309,
        0 10px 22px rgba(0,0,0,.35);
      transition: transform .08s ease, box-shadow .08s ease;
    }

    .main-button:hover {
      transform: translateY(-2px);
    }

    .main-button:active {
      transform: translateY(5px);
      box-shadow:
        0 1px 0 #b45309,
        0 4px 10px rgba(0,0,0,.3);
    }

    .main-button:disabled {
      opacity: .45;
      cursor: not-allowed;
      transform: none;
    }

    .small-button {
      margin-top: 14px;
      border: 2px solid rgba(255,255,255,.3);
      background: rgba(255,255,255,.08);
      color: white;
      border-radius: 12px;
      padding: 9px 16px;
      font-size: 14px;
      cursor: pointer;
    }

    /* HUD */

    .hud {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
      margin-bottom: 14px;
    }

    .stat {
      padding: 9px 5px;
      border-radius: 15px;
      background: rgba(255,255,255,.11);
      border: 2px solid rgba(255,255,255,.12);
      box-shadow: 0 6px 15px rgba(0,0,0,.2);
    }

    .stat-label {
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 1px;
      color: #cbd5e1;
      font-weight: bold;
    }

    .stat-number {
      margin-top: 2px;
      font-size: clamp(24px, 7vw, 34px);
      font-weight: 900;
    }

    #timer.warning {
      color: #fb7185;
      animation: pulse .55s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.13); }
    }

    /* BOARD */

    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: clamp(7px, 2vw, 12px);
      width: 100%;
      margin: 0 auto 18px;
    }

    .hole {
      position: relative;
      aspect-ratio: 1 / 1;
      border-radius: clamp(14px, 4vw, 23px);
      overflow: hidden;
      cursor: pointer;
      border: 3px solid rgba(255,255,255,.13);
      background:
        radial-gradient(
          ellipse at 50% 61%,
          #000 0%,
          #020617 37%,
          #172033 40%,
          #475569 53%,
          #111827 70%,
          #0f172a 100%
        );
      box-shadow:
        inset 0 8px 18px rgba(0,0,0,.9),
        0 6px 13px rgba(0,0,0,.32);
    }

    .hole::after {
      content: "";
      position: absolute;
      width: 80%;
      height: 19%;
      left: 10%;
      bottom: 6%;
      background: #020617;
      border-radius: 50%;
      opacity: .9;
      z-index: 3;
    }

    /* TARGET */

    .target {
      position: absolute;
      width: 72%;
      height: 72%;
      left: 14%;
      bottom: -78%;
      border-radius: 50% 50% 44% 44%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: clamp(42px, 12vw, 72px);
      background: linear-gradient(145deg, #f8fafc, #94a3b8);
      border: 4px solid white;
      box-shadow:
        inset 0 -9px 0 rgba(0,0,0,.15),
        0 8px 14px rgba(0,0,0,.4);
      transition: bottom .13s ease-out, transform .09s ease;
      z-index: 2;
    }

    .target.orange {
      background: linear-gradient(145deg, #fef08a, #f97316);
    }

    .target.green {
      background: linear-gradient(145deg, #86efac, #16a34a);
    }

    .target.purple {
      background: linear-gradient(145deg, #93c5fd, #7c3aed);
    }

    .hole.active .target {
      bottom: 14%;
    }

    .hole.hit .target {
      transform: scale(.55) rotate(20deg);
    }

    .hole.hit {
      animation: holeHit .16s ease;
    }

    @keyframes holeHit {
      50% {
        border-color: #facc15;
        transform: scale(.96);
      }
    }

    #message {
      min-height: 30px;
      margin: 15px 0 0;
      color: #facc15;
      font-size: clamp(17px, 5vw, 22px);
      font-weight: 900;
    }

    /* GAME OVER */

    .game-over {
      display: none;
      margin-top: 15px;
      padding: 17px;
      background: rgba(0,0,0,.28);
      border: 2px solid rgba(255,255,255,.12);
      border-radius: 18px;
    }

    .game-over.show {
      display: block;
    }

    .game-over-title {
      color: #facc15;
      font-size: 28px;
      font-weight: 900;
      margin-bottom: 6px;
    }

    .final-score {
      font-size: 19px;
      margin-bottom: 15px;
      line-height: 1.5;
    }

    /* MOBILE */

    @media (max-width: 480px) {
      body {
        align-items: flex-start;
      }

      .app {
        padding-top: 18px;
      }

      .characters {
        gap: 7px;
      }

      .character-card {
        padding: 10px 3px;
        border-radius: 15px;
      }

      .board {
        max-width: 430px;
      }

      .target {
        border-width: 3px;
      }

      .logo {
        letter-spacing: -2px;
      }
    }

    @media (max-height: 720px) and (orientation: landscape) {
      body {
        align-items: flex-start;
      }

      .app {
        max-width: 480px;
        padding-top: 8px;
      }

      .logo {
        font-size: 40px;
      }

      .subtitle {
        margin: 6px 0 10px;
      }

      .hud {
        margin-bottom: 7px;
      }

      .board {
        max-width: 350px;
        gap: 6px;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <h1 class="logo">POP-UP<br>SMASH!</h1>

    <div class="subtitle">
      Pick your target. Then smash as many as you can!
    </div>

    <!-- CHARACTER SELECTION -->

    <section id="characterScreen" class="screen active">

      <div class="select-title">
        CHOOSE YOUR CHARACTER
      </div>

      <div class="select-help">
        Tap a character to make them your target.
      </div>

      <div class="characters">

        <button
          class="character-card"
          data-character="🤪"
          data-color="orange"
          data-name="Goofball"
          type="button"
        >
          <div class="character-preview">🤪</div>
          <div class="character-name">GOOFBALL</div>
        </button>

        <button
          class="character-card"
          data-character="👽"
          data-color="green"
          data-name="Alien"
          type="button"
        >
          <div class="character-preview">👽</div>
          <div class="character-name">ALIEN</div>
        </button>

        <button
          class="character-card"
          data-character="🤡"
          data-color="purple"
          data-name="Clown"
          type="button"
        >
          <div class="character-preview">🤡</div>
          <div class="character-name">CLOWN</div>
        </button>

      </div>

      <button
        id="continueButton"
        class="main-button"
        type="button"
        disabled
      >
        SELECT A CHARACTER
      </button>

    </section>

    <!-- GAME SCREEN -->

    <section id="gameScreen" class="screen">

      <div class="hud">

        <div class="stat">
          <div class="stat-label">Score</div>
          <div id="score" class="stat-number">0</div>
        </div>

        <div class="stat">
          <div class="stat-label">Time</div>
          <div id="timer" class="stat-number">30</div>
        </div>

        <div class="stat">
          <div class="stat-label">Misses</div>
          <div id="misses" class="stat-number">0</div>
        </div>

      </div>

      <div id="board" class="board">

        <div class="hole"><div class="target"></div></div>
        <div class="hole"><div class="target"></div></div>
        <div class="hole"><div class="target"></div></div>

        <div class="hole"><div class="target"></div></div>
        <div class="hole"><div class="target"></div></div>
        <div class="hole"><div class="target"></div></div>

        <div class="hole"><div class="target"></div></div>
        <div class="hole"><div class="target"></div></div>
        <div class="hole"><div class="target"></div></div>

      </div>

      <button
        id="startButton"
        class="main-button"
        type="button"
      >
        START GAME
      </button>

      <div id="message">
        Ready to smash?
      </div>

      <button
        id="changeCharacterButton"
        class="small-button"
        type="button"
      >
        Change Character
      </button>

      <div id="gameOver" class="game-over">

        <div class="game-over-title">
          TIME'S UP! 💥
        </div>

        <div id="finalScore" class="final-score">
          Final Score: 0
        </div>

        <button
          id="playAgainButton"
          class="main-button"
          type="button"
        >
          PLAY AGAIN
        </button>

      </div>

    </section>

  </main>

  <script>

    /* =====================================
       ELEMENTS
    ====================================== */

    const characterScreen =
      document.getElementById("characterScreen");

    const gameScreen =
      document.getElementById("gameScreen");

    const characterCards =
      document.querySelectorAll(".character-card");

    const continueButton =
      document.getElementById("continueButton");

    const startButton =
      document.getElementById("startButton");

    const changeCharacterButton =
      document.getElementById("changeCharacterButton");

    const playAgainButton =
      document.getElementById("playAgainButton");

    const holes =
      document.querySelectorAll(".hole");

    const targets =
      document.querySelectorAll(".target");

    const scoreDisplay =
      document.getElementById("score");

    const timerDisplay =
      document.getElementById("timer");

    const missesDisplay =
      document.getElementById("misses");

    const message =
      document.getElementById("message");

    const gameOver =
      document.getElementById("gameOver");

    const finalScore =
      document.getElementById("finalScore");


    /* =====================================
       GAME VARIABLES
    ====================================== */

    let selectedCharacter = "";
    let selectedColor = "";
    let selectedName = "";

    let score = 0;
    let misses = 0;
    let timeLeft = 30;

    let gameRunning = false;
    let currentHole = null;

    let targetTimeout = null;
    let spawnTimeout = null;
    let timerInterval = null;
    let firstTargetTimeout = null;


    /* =====================================
       BUILT-IN AUDIO
    ====================================== */

    let audioContext = null;

    /*
      Used to prevent the miss sound from
      firing repeatedly on top of itself.
    */
    let lastMissSoundTime = 0;


    function initAudio() {

      if (!audioContext) {

        const AudioContext =
          window.AudioContext ||
          window.webkitAudioContext;

        if (AudioContext) {
          audioContext = new AudioContext();
        }

      }

      if (
        audioContext &&
        audioContext.state === "suspended"
      ) {
        audioContext.resume();
      }

    }


    function playTone(
      frequency,
      duration,
      type = "sine",
      volume = 0.12,
      endFrequency = null
    ) {

      if (!audioContext) return;

      const now =
        audioContext.currentTime;

      const oscillator =
        audioContext.createOscillator();

      const gain =
        audioContext.createGain();


      oscillator.type =
        type;


      oscillator.frequency.setValueAtTime(
        frequency,
        now
      );


      if (endFrequency !== null) {

        oscillator.frequency.exponentialRampToValueAtTime(
          Math.max(1, endFrequency),
          now + duration
        );

      }


      gain.gain.setValueAtTime(
        volume,
        now
      );

      gain.gain.exponentialRampToValueAtTime(
        0.001,
        now + duration
      );


      oscillator.connect(gain);
      gain.connect(audioContext.destination);

      oscillator.start(now);
      oscillator.stop(now + duration);

    }


    /* =====================================
       POP SOUND
    ====================================== */

    function playPopSound() {

      initAudio();

      playTone(
        520,
        0.08,
        "sine",
        0.08,
        850
      );

    }


    /* =====================================
       WHACK SOUND
    ====================================== */

    function playWhackSound() {

      initAudio();

      playTone(
        180,
        0.09,
        "square",
        0.14,
        70
      );


      setTimeout(() => {

        if (!gameRunning) return;

        playTone(
          95,
          0.07,
          "triangle",
          0.08,
          55
        );

      }, 25);

    }


    /* =====================================
       MISS SOUND

       Short, low downward thud.

       This is deliberately different from
       both the whack and end-game buzzer.

       The cooldown prevents multiple miss
       sounds from stacking annoyingly.
    ====================================== */

    function playMissSound() {

      initAudio();

      if (!audioContext) return;


      const now =
        audioContext.currentTime;


      /*
        Don't allow another miss sound
        within 180 milliseconds.
      */

      if (
        now - lastMissSoundTime < 0.18
      ) {
        return;
      }


      lastMissSoundTime = now;


      playTone(
        115,
        0.12,
        "triangle",
        0.09,
        65
      );

    }


    /* =====================================
       END BUZZER
    ====================================== */

    function playBuzzerSound() {

      initAudio();

      playTone(
        150,
        0.45,
        "sawtooth",
        0.11,
        105
      );


      setTimeout(() => {

        playTone(
          115,
          0.5,
          "sawtooth",
          0.10,
          75
        );

      }, 190);

    }


    /* =====================================
       CHARACTER SELECTION
    ====================================== */

    characterCards.forEach(card => {

      card.addEventListener(
        "click",
        () => {

          initAudio();


          characterCards.forEach(
            otherCard => {

              otherCard.classList.remove(
                "selected"
              );

            }
          );


          card.classList.add(
            "selected"
          );


          selectedCharacter =
            card.dataset.character;

          selectedColor =
            card.dataset.color;

          selectedName =
            card.dataset.name;


          continueButton.disabled =
            false;


          continueButton.textContent =
            "PLAY AS " +
            selectedName.toUpperCase();

        }
      );

    });


    /* =====================================
       ENTER GAME
    ====================================== */

    continueButton.addEventListener(
      "click",
      () => {

        initAudio();

        if (!selectedCharacter) {
          return;
        }


        updateTargets();


        characterScreen.classList.remove(
          "active"
        );

        gameScreen.classList.add(
          "active"
        );


        startButton.style.display =
          "inline-block";

        changeCharacterButton.style.display =
          "inline-block";


        message.textContent =
          selectedName +
          " is ready for a smashing!";

      }
    );


    /* =====================================
       UPDATE TARGETS
    ====================================== */

    function updateTargets() {

      targets.forEach(target => {

        target.textContent =
          selectedCharacter;


        target.classList.remove(
          "orange",
          "green",
          "purple"
        );


        target.classList.add(
          selectedColor
        );

      });

    }


    /* =====================================
       RANDOM HOLE
    ====================================== */

    function getRandomHole() {

      let hole;


      do {

        hole =
          holes[
            Math.floor(
              Math.random() *
              holes.length
            )
          ];

      }
      while (
        hole === currentHole &&
        holes.length > 1
      );


      return hole;

    }


    /* =====================================
       SHOW TARGET
    ====================================== */

    function showTarget() {

      if (!gameRunning) {
        return;
      }


      const hole =
        getRandomHole();


      currentHole =
        hole;


      hole.classList.add(
        "active"
      );


      /*
        Target appears: POP.
      */

      playPopSound();


      /*
        Target remains visible for
        500 to 950 milliseconds.
      */

      const visibleTime =
        Math.floor(
          Math.random() * 451
        ) + 500;


      targetTimeout =
        setTimeout(() => {

          if (!gameRunning) {
            return;
          }


          if (
            hole.classList.contains(
              "active"
            )
          ) {

            /*
              Target escaped.
            */

            hole.classList.remove(
              "active"
            );


            /*
              MISS STILL COUNTS.
            */

            misses++;

            missesDisplay.textContent =
              misses;


            /*
              NEW MISS SOUND.
            */

            playMissSound();


            message.textContent =
              "MISS!";


          }


          currentHole =
            null;


          scheduleNextTarget();

        }, visibleTime);

    }


    /* =====================================
       NEXT TARGET
    ====================================== */

    function scheduleNextTarget() {

      if (!gameRunning) {
        return;
      }


      const delay =
        Math.floor(
          Math.random() * 301
        ) + 120;


      spawnTimeout =
        setTimeout(
          showTarget,
          delay
        );

    }


    /* =====================================
       HIT TARGET
    ====================================== */

    function hitTarget(hole) {

      if (!gameRunning) {
        return;
      }


      if (
        !hole.classList.contains(
          "active"
        )
      ) {
        return;
      }


      clearTimeout(
        targetTimeout
      );


      hole.classList.remove(
        "active"
      );

      hole.classList.add(
        "hit"
      );


      /*
        Successful hit sound.
      */

      playWhackSound();


      score++;

      scoreDisplay.textContent =
        score;


      const hitMessages = [
        "SMASH! 💥",
        "POW! 💥",
        "GOT 'EM! 🔨",
        "BOOM! 💥",
        "NICE HIT! 🔥"
      ];


      message.textContent =
        hitMessages[
          Math.floor(
            Math.random() *
            hitMessages.length
          )
        ];


      setTimeout(() => {

        hole.classList.remove(
          "hit"
        );

      }, 120);


      currentHole =
        null;


      scheduleNextTarget();

    }


    /* =====================================
       HOLE CONTROLS
    ====================================== */

    holes.forEach(hole => {

      hole.addEventListener(
        "pointerdown",
        event => {

          event.preventDefault();

          initAudio();

          hitTarget(hole);

        }
      );

    });


    /* =====================================
       START GAME
    ====================================== */

    function startGame() {

      initAudio();

      clearGameTimers();


      holes.forEach(hole => {

        hole.classList.remove(
          "active",
          "hit"
        );

      });


      score = 0;
      misses = 0;
      timeLeft = 30;

      lastMissSoundTime = 0;


      scoreDisplay.textContent =
        score;

      missesDisplay.textContent =
        misses;

      timerDisplay.textContent =
        timeLeft;


      timerDisplay.classList.remove(
        "warning"
      );


      gameOver.classList.remove(
        "show"
      );


      gameRunning =
        true;


      currentHole =
        null;


      startButton.style.display =
        "none";

      changeCharacterButton.style.display =
        "none";


      message.textContent =
        "GET READY...";


      /*
        First target.
      */

      firstTargetTimeout =
        setTimeout(() => {

          if (!gameRunning) {
            return;
          }

          message.textContent =
            "SMASH 'EM!";

          showTarget();

        }, 500);


      /*
        30 SECOND TIMER
      */

      timerInterval =
        setInterval(() => {

          timeLeft--;


          timerDisplay.textContent =
            timeLeft;


          if (timeLeft <= 5) {

            timerDisplay.classList.add(
              "warning"
            );

          }


          if (timeLeft <= 0) {

            endGame();

          }

        }, 1000);

    }


    /* =====================================
       END GAME
    ====================================== */

    function endGame() {

      if (!gameRunning) {
        return;
      }


      gameRunning =
        false;


      clearGameTimers();


      holes.forEach(hole => {

        hole.classList.remove(
          "active",
          "hit"
        );

      });


      currentHole =
        null;


      timerDisplay.textContent =
        "0";


      /*
        End buzzer remains separate
        from the miss sound.
      */

      playBuzzerSound();


      finalScore.innerHTML =
        "Final Score: <strong>" +
        score +
        "</strong><br>" +
        "Misses: <strong>" +
        misses +
        "</strong>";


      if (score >= 30) {

        message.textContent =
          "🔥 SMASH MASTER!";

      }
      else if (score >= 20) {

        message.textContent =
          "💥 AWESOME RUN!";

      }
      else if (score >= 10) {

        message.textContent =
          "👏 NICE SMASHING!";

      }
      else {

        message.textContent =
          "Keep swinging! 🔨";

      }


      gameOver.classList.add(
        "show"
      );


      changeCharacterButton.style.display =
        "inline-block";

    }


    /* =====================================
       CLEAR TIMERS
    ====================================== */

    function clearGameTimers() {

      clearTimeout(
        targetTimeout
      );

      clearTimeout(
        spawnTimeout
      );

      clearTimeout(
        firstTargetTimeout
      );

      clearInterval(
        timerInterval
      );

    }


    /* =====================================
       PLAY AGAIN
    ====================================== */

    playAgainButton.addEventListener(
      "click",
      () => {

        initAudio();

        gameOver.classList.remove(
          "show"
        );

        startGame();

      }
    );


    /* =====================================
       START BUTTON
    ====================================== */

    startButton.addEventListener(
      "click",
      () => {

        initAudio();

        startGame();

      }
    );


    /* =====================================
       CHANGE CHARACTER
    ====================================== */

    changeCharacterButton.addEventListener(
      "click",
      () => {

        initAudio();


        gameRunning =
          false;


        clearGameTimers();


        holes.forEach(hole => {

          hole.classList.remove(
            "active",
            "hit"
          );

        });


        gameScreen.classList.remove(
          "active"
        );

        characterScreen.classList.add(
          "active"
        );


        gameOver.classList.remove(
          "show"
        );


        startButton.style.display =
          "inline-block";

        changeCharacterButton.style.display =
          "inline-block";


        message.textContent =
          "Ready to smash?";

      }
    );

  </script>

</body>
</html>
